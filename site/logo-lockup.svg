<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="680" height="140" role="img" aria-label="Per My Last Webhook">
  <defs>
    <linearGradient id="pmlw-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F6FEB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="pmlw-word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F6FEB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Icon tile: brand-gradient rounded square -->
  <rect x="16" y="20" width="100" height="100" rx="26" fill="url(#pmlw-tile)" />

  <!-- Webhook fan-in mark (3 sources → 1 channel), white, scaled + centred in the tile -->
  <g transform="translate(3.9,10.5) scale(0.62)" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill-rule="evenodd">
    <circle cx="48" cy="56"  r="10" stroke="none" />
    <circle cx="48" cy="96"  r="10" stroke="none" />
    <circle cx="48" cy="136" r="10" stroke="none" />
    <path d="M 56 56  Q 100 56  130 96" fill="none" />
    <path d="M 56 96  L 130 96"         fill="none" />
    <path d="M 56 136 Q 100 136 130 96" fill="none" />
    <circle cx="140" cy="96" r="22" stroke="none" />
  </g>

  <!-- Wordmark -->
  <text x="142" y="84"
        font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="46" letter-spacing="-1.2">
    <tspan fill="#1b1c20">Per My Last </tspan><tspan fill="url(#pmlw-word)">Webhook</tspan>
  </text>
  <text x="143" y="112"
        font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="15" letter-spacing="2.6" fill="#74766a">
    CI / CD EVENTS · AS RICH TEAMS CARDS
  </text>
</svg>
